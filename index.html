<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skeleton Loading</title>
    <link rel="stylesheet" href="./output.css">
</head>

<body class="bg-gray-100 p-6">

    <!-- SKELETON LOADING -->
    <main id="skeleton"
        class="max-w-3xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-6">

        <!-- Left Card -->
        <div class="bg-white rounded-lg shadow-md">

            <div class="p-5 border-b border-gray-200">
                <div class="animate-pulse">

                    <!-- Image placeholder -->
                    <div class="h-44 bg-gray-300"></div>

                    <div class="flex items-center justify-between gap-4 mt-5">

                        <!-- Text placeholders -->
                        <div class="w-1/2">
                            <div class="h-3 w-2/3 bg-gray-300 rounded-full"></div>
                            <div class="h-3 bg-gray-300 rounded-full mt-3"></div>
                        </div>

                        <!-- Button placeholder -->
                        <div class="h-9 w-1/2 bg-gray-300 rounded-full"></div>

                    </div>

                </div>
            </div>

            <!-- Description placeholders -->
            <div class="p-5 border-b border-gray-200">
                <div class="animate-pulse">
                    <div class="h-3 bg-gray-300 rounded-full"></div>
                    <div class="h-3 w-1/3 bg-gray-300 rounded-full mt-3"></div>
                    <div class="h-3 w-3/4 bg-gray-300 rounded-full mt-3"></div>
                    <div class="h-3 w-1/2 bg-gray-300 rounded-full mt-3"></div>
                </div>
            </div>

            <!-- Bottom placeholder -->
            <div class="p-5">
                <div class="animate-pulse">
                    <div class="h-7 bg-gray-300 rounded-full"></div>
                </div>
            </div>

        </div>

        <!-- Right Card -->
        <div class="bg-white rounded-lg shadow-md">

            <div class="p-5 border-b border-gray-200">
                <div class="animate-pulse flex items-center justify-between gap-5">

                    <!-- Name placeholders -->
                    <div class="w-2/3">
                        <div class="h-3 bg-gray-300 rounded-full"></div>
                        <div class="h-3 w-2/3 bg-gray-300 rounded-full mt-3"></div>
                    </div>

                    <!-- Profile placeholder -->
                    <div class="w-16 h-16 bg-gray-300 rounded-full shrink-0"></div>

                </div>
            </div>

            <!-- Large image placeholder -->
            <div class="p-5">
                <div class="animate-pulse">
                    <div class="h-80 bg-gray-300"></div>
                </div>
            </div>

        </div>

    </main>

    <!-- REAL CONTENT: HIDDEN AT FIRST -->
    <main id="real-content" class="hidden max-w-3xl mx-auto">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

            <!-- Left Card -->
            <div class="bg-white rounded-lg shadow-md">

                <div class="p-5 border-b border-gray-200">

                    <div class="h-44 bg-green-100 flex items-center justify-center">
                        <h1 class="text-3xl font-bold text-green-800">
                            NOVIQ STUDIO
                        </h1>
                    </div>

                    <div class="flex items-center justify-between gap-4 mt-5">
                        <div>
                            <h2 class="font-bold">Brand Design</h2>
                            <p class="text-sm text-gray-500">Creative services</p>
                        </div>

                        <a href="mailto:hussainfasrath1020@gmail.com"
                            class="bg-green-700 text-white px-5 py-2 rounded-full">
                            Contact
                        </a>
                    </div>

                </div>

                <div class="p-5 border-b border-gray-200">
                    <p class="text-gray-600">
                        We create simple and beautiful logos,
                        business cards, and brand identities.
                    </p>
                </div>

                <div class="p-5">
                    <p class="bg-green-100 text-green-800 text-center rounded-full py-2">
                        Let's create something!
                    </p>
                </div>

            </div>

            <!-- Right Card -->
            <div class="bg-white rounded-lg shadow-md">

                <div class="p-5 border-b border-gray-200 flex items-center justify-between gap-5">

                    <div>
                        <h2 class="font-bold">Fasrath Hussain</h2>
                        <p class="text-sm text-gray-500">Graphic Designer</p>
                    </div>

                    <div class="w-16 h-16 bg-green-700 text-white rounded-full shrink-0 flex items-center justify-center">
                        <span class="text-xl font-bold">FH</span>
                    </div>

                </div>

                <div class="p-5">
                    <div class="h-80 bg-green-100 flex items-center justify-center">
                        <p class="text-2xl font-bold text-green-800">
                            My Portfolio
                        </p>
                    </div>
                </div>

            </div>

        </div>

    </main>

    <!-- JAVASCRIPT -->
    <script>
        // Wait 3 seconds to simulate loading
        setTimeout(() => {

            // Hide skeleton
            document.getElementById("skeleton").classList.add("hidden");

            // Show real content
            document.getElementById("real-content").classList.remove("hidden");

        }, 3000);
    </script>

</body>

</html>
